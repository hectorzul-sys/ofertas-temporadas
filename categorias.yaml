# categorias.yaml — qué ofertas de Promodescuentos nos interesan.
# Hector no lo edita a mano: le dice a Claude qué cambiar ("agrega freidora a Hogar").
#
# Cómo decide el bot (en cada oferta que trae Promodescuentos):
# - Entra a una categoría si viene de una de sus categorías de Promodescuentos o tiene una de sus palabras,
#   no tiene nada de "excluir", tiene los grados mínimos y no pasa del precio máximo.
# - AVISO AL MOMENTO (cuenta para el tope del día) si además tiene una de las palabras de la categoría,
#   o si la comunidad la calentó muchísimo (grados_aviso_directo).
# - Lo demás que entra va al RESUMEN de las 21:00 (las mejores por grados).
# - Los grados solo vienen en el feed de "tendencias"; las ofertas recién publicadas no traen grados
#   y solo sirven para la lista de productos (productos.yaml).
# - El "% de descuento" no se usa este año: el feed no trae un precio anterior fiable.

general:
  avisos_por_dia: 5             # inmediatos; el resto va al resumen
  avisos_por_dia_temporada: 10  # Buen Fin, Black Friday, Cyber Monday
  temporadas:                   # en estas fechas sube el tope
    - {nombre: Buen Fin, desde: 2026-11-13, hasta: 2026-11-17}
    - {nombre: Black Friday y Cyber Monday, desde: 2026-11-27, hasta: 2026-11-30}
  no_repetir_dias: 7            # la misma oferta no vuelve en 7 días, salvo que baje 5 % o más
  baja_para_repetir: 5          # %
  resumen_hora: "21:00"
  zona: America/Mexico_City
  resumen_max: 15               # ofertas en el resumen (además de los avisos del día)
  grados_minimos: 100           # filtro de la comunidad; cada categoría puede cambiarlo
  grados_aviso_directo: 600     # tan calientes que avisan aunque no tengan palabra
  caro_profeco: 3000            # desde este precio el aviso recuerda comparar en Profeco
  excluir: [reacondicionado, reacondicionada, seminuevo, usado,
            # Decidido por Hector el 29-oct: nada de jabones, súper ni cosas de uso diario
            jabon, shampoo, champu, acondicionador, detergente, suavizante, cloro, desodorante, crema,
            pasta dental, cepillo dental, papel higienico, toallitas, panales, perfume, maquillaje,
            labial, cerveza, tequila, vino, whisky, mezcal, licor, comida, croquetas]

# Lo que más le importa a la familia: electrodomésticos y tecnología.
# Hogar, Herramientas y Juguetes van SOLO por palabras (sus categorías de Promodescuentos traen mucha
# cosa chica: fundas, adornos, pañales…). Tecnología y Videojuegos sí siguen toda su categoría.
categorias:
  Electrodomésticos y pantallas:
    palabras: [pantalla, television, televisor, smart tv, tv, refrigerador, refri, lavadora, secadora,
               estufa, horno, microondas, freidora, licuadora, batidora, cafetera, aspiradora,
               robot aspiradora, aire acondicionado, minisplit, ventilador, calentador, boiler,
               lavavajillas, plancha, purificador, olla de presion, olla electrica, extractor, parrilla electrica]
    excluir: [funda, protector, soporte, control remoto, filtro, repuesto, accesorio, accesorios]
    precio_max: 25000
  Tecnología:
    promodescuentos: [Tecnología]
    palabras: [ssd, monitor, audifonos, router, laptop, tablet, smartwatch, celular, impresora, bocina]
    excluir: [funda, mica, protector de pantalla, cable, cargador]
    precio_max: 25000
    grados_minimos: 150
  Videojuegos y consolas:
    promodescuentos: [Videojuegos]
    palabras: [ps5, playstation, nintendo switch, switch 2, xbox series, control dualsense, control xbox]
    precio_max: 15000
    grados_minimos: 150
  Herramientas y taller:
    excluir: [accesorio, accesorios, broca, brocas]
    palabras: [taladro, esmeril, juego de llaves, rotomartillo, caja de herramientas, atornillador, sierra,
               compresor, hidrolavadora]
    precio_max: 8000
  Juguetes y coleccionables:
    palabras: [hot wheels, lego, funko, pop mart]
    precio_max: 3000
    grados_minimos: 60          # menos votos en este tema; avisar antes
